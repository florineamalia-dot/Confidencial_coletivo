<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL - ACESSO RESTRITO</title>
    <style>
        body { 
            background-color: #0a0a0a; 
            color: #00ff00; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            overflow: hidden;
        }
        .container { 
            border: 2px solid #1a1a1a; 
            padding: 40px; 
            background-color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
        }
        .status { color: #ff0000; font-weight: bold; text-transform: uppercase; }
        .cursor { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="container">
        <p>> CONECTANDO AO SERVIDOR...</p>
        <p>> STATUS: <span class="status">ACESSO NEGADO</span></p>
        <p>> ERRO: AS CREDENCIAIS NÃO FORAM RECONHECIDAS PELA CENTRAL.</p>
        <p>> O SEU IP FOI REGISTRADO NA BASE DE DADOS.<span class="cursor">_</span></p>
    </div>

    </body>
</html>
